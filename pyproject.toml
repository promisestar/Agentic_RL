[project]
name = "ecom-rlve"
version = "0.1.0"
description = "EcomRLVE-GYM: Verifiable adaptive-difficulty e-commerce conversation environments for RL training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "trl>=0.8.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Gradio interactive demo (space/)
space = [
    "gradio>=5.0.0",
    "huggingface_hub>=0.26.0",
]
# OpenEnv GRPO training (scripts/train_openenv.py)
# Install: uv sync --extra train
#
# Qwen3.5 needs transformers>=5.2. Current unsloth caps transformers at <=5.5.0,
# while vllm>=0.24 requires transformers>=5.5.3 — no overlapping range.
# Therefore train does NOT hard-depend on vllm; use --fast_inference only if you
# install a compatible vllm stack separately (typically for older model families).
train = [
    "unsloth",
    "transformers>=5.2.0,<=5.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_rlve"]

[tool.uv]
package = true
# Prefer CUDA wheels that match the local toolkit when resolving torch stack.
torch-backend = "auto"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
